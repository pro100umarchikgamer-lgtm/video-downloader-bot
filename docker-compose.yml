services:
  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python bot.py' >/dev/null && find /app/data/health.ready -mmin -2 -print -quit | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional. Enable with: docker compose --profile local-api up -d --build
  # and set TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081 in .env.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
